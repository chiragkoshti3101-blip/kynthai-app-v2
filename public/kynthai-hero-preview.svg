<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kynthai family health app preview</title>
  <desc id="desc">A calm green app preview showing medication reminders and family care tools.</desc>
  <defs>
    <linearGradient id="background" x1="56" y1="38" x2="899" y2="682" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFDF5"/>
      <stop offset="0.52" stop-color="#D1FAE5"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="accent" x1="174" y1="102" x2="786" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="screen" x1="300" y1="128" x2="665" y2="615" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFFC"/>
      <stop offset="1" stop-color="#EFFCF7"/>
    </linearGradient>
    <filter id="shadow" x="232" y="42" width="500" height="650" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#065F46" flood-opacity="0.2"/>
    </filter>
    <filter id="cardShadow" x="310" y="274" width="340" height="215" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#047857" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="720" rx="38" fill="url(#background)"/>
  <circle cx="128" cy="112" r="176" fill="#A7F3D0" fill-opacity="0.34"/>
  <circle cx="870" cy="610" r="230" fill="#99F6E4" fill-opacity="0.3"/>
  <path d="M0 564C186 478 292 594 468 550C656 503 741 423 960 460V720H0V564Z" fill="#10B981" fill-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="264" y="48" width="432" height="624" rx="48" fill="#10231E"/>
    <rect x="279" y="65" width="402" height="590" rx="37" fill="url(#screen)"/>
    <rect x="419" y="78" width="122" height="19" rx="9.5" fill="#10231E"/>
  </g>

  <g>
    <rect x="309" y="126" width="48" height="48" rx="15" fill="url(#accent)"/>
    <path d="M333 164C326 159 318 154 319 146C320 141 325 138 329 141C331 137 336 137 339 141C343 138 348 141 348 146C348 154 340 159 333 164Z" fill="white"/>
    <path d="M326 151H330L332 146L334 156L337 143L339 153L342 149H346" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="371" y="145" fill="#12352A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Kynthai</text>
    <text x="371" y="166" fill="#5B756C" font-family="Arial, Helvetica, sans-serif" font-size="13">Your family’s health, connected.</text>
    <circle cx="634" cy="150" r="20" fill="#D1FAE5"/>
    <path d="M626 150L632 156L643 144" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="309" y="218" fill="#163A2F" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Good morning</text>
  <text x="309" y="243" fill="#5B756C" font-family="Arial, Helvetica, sans-serif" font-size="14">A simple view of today’s care.</text>

  <g filter="url(#cardShadow)">
    <rect x="309" y="274" width="342" height="91" rx="20" fill="white"/>
    <circle cx="344" cy="319" r="23" fill="#D1FAE5"/>
    <path d="M337 319L342 324L352 313" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="381" y="310" fill="#163A2F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Today’s reminders</text>
    <text x="381" y="333" fill="#5B756C" font-family="Arial, Helvetica, sans-serif" font-size="13">Morning medicines · All set</text>
    <rect x="581" y="305" width="45" height="24" rx="12" fill="#ECFDF5"/>
    <text x="593" y="321" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">3/3</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="309" y="383" width="342" height="91" rx="20" fill="white"/>
    <circle cx="344" cy="428" r="23" fill="#CCFBF1"/>
    <path d="M334 427C334 421 338 417 344 417C350 417 354 421 354 427V438H334V427Z" stroke="#0F766E" stroke-width="2.5"/>
    <path d="M339 441H349" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
    <text x="381" y="419" fill="#163A2F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Care team</text>
    <text x="381" y="442" fill="#5B756C" font-family="Arial, Helvetica, sans-serif" font-size="13">Keep consultations and updates together</text>
  </g>

  <g>
    <rect x="309" y="507" width="342" height="92" rx="20" fill="url(#accent)"/>
    <text x="334" y="539" fill="#ECFDF5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">KYNTHAI HEALTH COMPANION</text>
    <text x="334" y="568" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Privacy-first tools for families</text>
    <text x="334" y="588" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="12">Reminders · Care coordination · Health information</text>
  </g>

  <text x="480" y="636" text-anchor="middle" fill="#B7EBD6" font-family="Arial, Helvetica, sans-serif" font-size="11">Kynthai preview</text>
</svg>
