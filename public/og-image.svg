<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#overlay)"/>
  <!-- Subtle pattern -->
  <circle cx="100" cy="500" r="300" fill="rgba(255,255,255,0.04)"/>
  <circle cx="900" cy="100" r="250" fill="rgba(255,255,255,0.04)"/>
  <!-- Global, region-neutral headline -->
  <text x="80" y="260" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-1">
    Kynthai
  </text>
  <text x="80" y="340" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="36" fill="rgba(255,255,255,0.9)" letter-spacing="-0.5">
    Your family's health, connected.
  </text>
  <!-- Separator -->
  <rect x="80" y="420" width="60" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <!-- Tags -->
  <text x="80" y="470" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.75)">
