# gitleaks config — secret scanner for CI.
#
# Catches accidentally committed real secrets. The repo's *deliberate*
# placeholder / test / dev-only secrets are allowlisted below so they don't
# produce false positives, while anything that looks like a real credential
# (a populated .env value, an AWS key, a Stripe live key, a pushed JWT)
# still fails the build.

title = "Kynthai gitleaks config"

[schema]
version = 2

# --- Benign, intentionally-committed strings ---------------------------------
[allowlist]
description = "Documented placeholders and dev-only fallback secrets"
# Files that intentionally contain template placeholders / dev fallbacks.
paths = [
  '''\.env\.example$''',
  '''SECRETS\.md$''',
  '''env-template\.txt$''',
  '''^docs/''',
  # The dev-only session-signing fallback is documented and refused in prod.
  '''src/lib/session-signing\.ts''',
  # Unit tests use obviously-fake secrets.
  '''src/lib/__tests__/''',
  '''src/lib/.+\.test\.ts''',
  # vitest env fallbacks are empty strings resolved from CI env, not secrets.
  '''vitest\.config\.ts''',
]
# Specific benign literal values that must not fail the scan.
regexes = [
  # The explicit dev fallback secret — only valid when NODE_ENV != production.
  '''kynthai-dev-fallback-secret''',
  # Obvious placeholders from templates / docs.
  '''YOUR_PASSWORD''',
  '''YOUR_PROJECT''',
  '''your-sentry-dsn-here''',
  '''sk_test_\.\.\.''',
  '''sk_live_\.\.\.''',
  '''test-encryption-key''',
  '''test-supabase-jwt-secret''',
  '''test-service-key''',
]
stopWords = []
