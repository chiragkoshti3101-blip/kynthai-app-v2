# Closed-app medication pushes (works when Chrome/Safari are fully closed).
# Vercel Hobby = 1 cron/day only. This Action is the minute-level engine.
#
# Secrets: CRON_SECRET, APP_URL=https://kynthai.app
name: Reminder push (closed-app)

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ensure today's reminder rows + send due pushes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${APP_URL:-}" ]; then
            echo "Missing CRON_SECRET or APP_URL secret"
            exit 0
          fi
          auth=(-H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json")
          curl -sS -o /tmp/sched.json -w "schedule HTTP %{http_code}\n" \
            "${auth[@]}" "${APP_URL}/api/reminders/schedule" || true
          cat /tmp/sched.json || true
          echo
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            "${auth[@]}" "${APP_URL}/api/reminders/send?mode=tick" || true)
          echo "send HTTP $code"
          cat /tmp/out.json || true
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "Non-OK (will retry next tick)"
          fi
