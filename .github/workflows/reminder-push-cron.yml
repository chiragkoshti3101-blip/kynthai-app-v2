# Closed-app medication pushes (works when Chrome/Safari are fully closed).
#
# BILLING REALITY (corrects the old "public repo" assumption): this repo is
# PRIVATE, so GitHub-hosted runners bill minutes (~2,000 free/month). A
# minute-level chain burns ~1,440 min/day, so it can only run continuously
# while Actions minutes exist (public repo / paid plan / monthly reset).
# This file degrades gracefully under any budget:
#   - schedule anchors fire 6x/day, do ONE sweep, then try to re-arm the
#     chain — <1 runner-minute each (~4 min/month total);
#   - when minutes exist the anchor-dispatched chain runs the full loop;
#   - when minutes run out, runs die instantly (empty steps, no logs) and
#     the next anchor auto-revives the chain after the monthly reset.
# Vercel 4-hourly catch-up crons remain the always-free backstop.
#
# WHY SELF-PERPETUATION: GitHub's scheduler drops/delays `schedule:` starts
# unpredictably (observed: 29h with zero scheduled starts), so anchors alone
# leave multi-hour dead zones with NO ticks => missed doses. Therefore a
# dispatched run loops ~5.5 hours pinging the tick endpoint every 60s, then
# dispatches its own successor via the API (DISPATCH_TOKEN secret) before
# exiting. One manual start => an unbroken minute-level chain.
#
# CONCURRENCY: split by event. Anchors live in their own group so they can
# NEVER cancel a live chain (the old design let every 30-min anchor kill the
# 5.5h chain before it ever reached its own chaining step — the engine was
# guaranteed to die even when minutes were plentiful).
#
# Secrets: CRON_SECRET, APP_URL=https://kynthai.app, DISPATCH_TOKEN (fine-
# grained PAT with Actions:write — used ONLY to re-dispatch this workflow).
name: Reminder push (closed-app)

on:
  schedule:
    - cron: '23 */4 * * *'   # restart anchor: 6/day, single sweep each
  workflow_dispatch:
    inputs:
      chained_from:
        description: 'Run id of the predecessor chain link (diagnostics only)'
        required: false
        default: ''
      loop_minutes:
        description: 'Chain tick-loop length in minutes (default 330)'
        required: false
        default: '330'

concurrency:
  group: reminder-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Sweep due reminders (chain mode loops, anchor mode sweeps once)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${APP_URL:-}" ]; then
            echo "Missing CRON_SECRET or APP_URL secret"
            exit 0
          fi
          auth=(-H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json")

          sweep_once() {
            # Ensure today's reminder rows exist, then tick once (idempotent).
            curl -sS -o /tmp/sched.json -w "schedule HTTP %{http_code}\n" \
              "${auth[@]}" "${APP_URL}/api/reminders/schedule" || true
            head -c 300 /tmp/sched.json || true; echo
            code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" --max-time 30 \
              "${auth[@]}" "${APP_URL}/api/reminders/send?mode=tick" || echo "000")
            echo "[anchor] tick HTTP ${code}"
            head -c 300 /tmp/tick.json || true; echo
          }

          chain() {
            # Re-arm the engine: dispatch the successor run (3 retries).
            if [ -z "${DISPATCH_TOKEN:-}" ]; then
              echo "[chain] DISPATCH_TOKEN missing — cannot self-perpetuate"
              return 1
            fi
            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/chain.json -w "%{http_code}" --max-time 30 \
                -X POST \
                -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPO}/actions/workflows/reminder-push-cron.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"chained_from\":\"${RUN_ID}\",\"loop_minutes\":\"${LOOP_MINUTES}\"}}" || echo "000")
              echo "[chain] attempt ${i} HTTP ${code}"
              if [ "$code" = "204" ]; then return 0; fi
              head -c 300 /tmp/chain.json || true; echo
              sleep 30
            done
            return 1
          }

          if [ "${EVENT_NAME}" = "schedule" ]; then
            # ANCHOR MODE: cheap sweep, then try to re-arm the perpetuating
            # chain (the dispatch is a no-op unless Actions minutes exist).
            sweep_once
            if chain; then
              echo "[anchor] chain re-armed — full loop takes over"
            else
              echo "[anchor] chain not re-armed — Vercel catchups remain"
            fi
            exit 0
          fi

          # CHAIN MODE: minute-level tick loop, then dispatch the successor.
          end=$((SECONDS + ${LOOP_MINUTES:-330} * 60))
          n=0
          fail=0
          consec=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" \
              --max-time 30 \
              "${auth[@]}" "${APP_URL}/api/reminders/send?mode=tick" || echo "000")
            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              fail=$((fail + 1))
              consec=$((consec + 1))
              echo "[tick $n] HTTP $code (consecutive failures: $consec)"
              head -c 300 /tmp/tick.json || true
              echo
              if [ "$consec" -ge 5 ]; then
                echo "5 consecutive failures — chaining successor early, exiting"
                chain || true
                exit 0
              fi
            else
              consec=0
              due=$(sed -n 's/.*"due":\([0-9]*\).*/due=\1/p' /tmp/tick.json | head -1)
              sent=$(sed -n 's/.*"sent":\([0-9]*\).*/sent=\1/p' /tmp/tick.json | head -1)
              echo "[tick $n] HTTP $code ${due:-} ${sent:-}"
            fi
            sleep 60
          done
          echo "Loop complete: $n ticks, $fail failures — dispatching successor"
          if chain; then
            echo "[chain] successor dispatched — chain continues"
          else
            echo "[chain] FAILED — schedule anchors + Vercel catchups remain"
          fi
