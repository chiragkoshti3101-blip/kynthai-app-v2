name: CI — Security Audit & SBOM

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  # No secrets needed for lint/build/audit steps
  # Production secrets are injected by Vercel, not CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security Audit & Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify lockfile integrity
        run: |
          echo "🔐 Verifying package-lock.json integrity..."
          npm ls --all --depth=0 2>&1 | head -5 || true
          echo "✔ Lockfile loaded — $(wc -l < package-lock.json) lines"

      - name: Clean install dependencies
        run: |
          echo "📦 Installing dependencies (frozen lockfile)..."
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run npm audit (fail on high+)
        # Blocking gate: high/critical CVEs fail CI, EXCEPT the known
        # next-bundled sharp/postcss advisories whose only npm fix is
        # next@16.3.1 (breaks the Vercel prod build). See scripts/check-deps.mjs.
        run: |
          echo "🔍 Running dependency audit — blocking on un-allowlisted HIGH/CRITICAL..."
          node scripts/deps-audit-check.mjs

      - name: Generate SBOM (CycloneDX)
        run: |
          echo "📋 Generating Software Bill of Materials (SBOM)..."
          mkdir -p sbom
          # npm 10+ supports native sbom generation. Known quirk: `npm sbom`
          # aborts with ESBOMPROBLEMS when next@16.2.12 bundles its own sharp
          # 0.34.5 alongside the project's direct sharp ^0.35.3 (the resolver
          # chokes on the duplicated @img/sharp-wasm32).next platform tree.
          # That is not a dependency-version error worth failing CI on, so fall
          # back to an explicit CycloneDX tool if the native sbom errors.
          if npm sbom --sbom-format=cyclonedx > sbom/cyclonedx.json 2>/tmp/sbom.err; then
            echo "  ✅ npm sbom OK ($(wc -c < sbom/cyclonedx.json) bytes)"
          elif grep -q 'ESBOMPROBLEMS' /tmp/sbom.err; then
            echo "  ⚠️ npm sbom rejected dual-sharp platform tree (known tooling quirk, not a vuln) — using CycloneDX tool"
            npx @cyclonedx/bom --output sbom/cyclonedx.json 2>&1 | tail -2 || \
              (npm install -g @cyclonedx/bom >/dev/null 2>&1 && cyclonedx-bom -o sbom/cyclonedx.json 2>&1 | tail -2)
          else
            echo "  ❌ npm sbom failed with an unexpected error:"
            cat /tmp/sbom.err
            exit 1
          fi

      - name: Generate SBOM summary
        run: |
          echo "📊 SBOM Summary:"
          if [ -f sbom/cyclonedx.json ] && [ -s sbom/cyclonedx.json ]; then
            echo "  ✅ CycloneDX SBOM generated ($(wc -c < sbom/cyclonedx.json) bytes)"
            # Extract key metrics if jq is available
            if command -v jq &> /dev/null; then
              echo "  📦 Components: $(jq '.components | length // 0' sbom/cyclonedx.json)"
              echo "  🏷  Format: $(jq -r '.bomFormat // "unknown"' sbom/cyclonedx.json)"
            fi
          else
            echo "  ⚠️ No SBOM produced (npm sbom + CycloneDX tool both unavailable)"
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom/cyclonedx.json
          retention-days: 90
          if-no-files-found: warn

      - name: Export audit summary
        run: |
          if [ -f sbom/cyclonedx.json ]; then
            TOTAL_DEPS=$(jq '.components | length // 0' sbom/cyclonedx.json)
            echo "## 📋 SBOM Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Total dependencies catalogued:** $TOTAL_DEPS" >> $GITHUB_STEP_SUMMARY
            echo "- **Format:** CycloneDX 1.6" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact:** sbom-cyclonedx (90-day retention)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc -b --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        # Lint only source + e2e + scripts (excludes generated .vercel/.next output).
        run: npx eslint src e2e scripts prisma --max-warnings=0

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Vitest
        run: npx vitest --run --reporter=verbose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'test-encryption-key-not-for-production' }}

  # API-first smoke checks against the live production deployment (kynthai.app).
  # Public pages 200, protected routes 307->/login, health, plus lightweight
  # browser assertions. Runs on push/PR; a transient prod issue fails PRs, so
  # this is a canary, not a code gate — the deploy.yml e2e job is the real
  # gate and it runs against the freshly built local server.
  e2e-smoke:
    name: E2E Smoke (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run prod smoke tests
        run: npx playwright test e2e/ci-smoke.spec.ts --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: https://kynthai.app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: e2e-report/
          retention-days: 30
