# Secret-scanning gate — blocks any commit that introduces a real secret.
#
# Closes the "no secret scanning" gap: gitleaks runs on every push to a PR and
# on the default branch, scanning the full git history. It uses the repo's
# gitleaks.toml (allowlisted placeholders / dev-only fallbacks) so it fails
# only on credentials that look real.
name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

# gitleaks scans are read-only.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so the scan covers everything ever committed
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .gitleaks.toml
