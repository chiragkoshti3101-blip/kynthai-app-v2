name: Build & Deploy

on:
  push:
      branches: [main]
        workflow_dispatch:

        env:
          NODE_VERSION: '22'
            NEXT_PUBLIC_APP_URL: 'https://kynthai.app'

            concurrency:
              group: deploy-${{ github.ref }}
                cancel-in-progress: true

                jobs:
                  # ── Job 1: Lint + Type Check + Unit Tests ─────────────────────────────────
                    quality:
                        name: Quality Checks
                            runs-on: ubuntu-latest
                                timeout-minutes: 20
                                    permissions:
                                          contents: read

                                              steps:
                                                    - uses: actions/checkout@v4

                                                          - uses: actions/setup-node@v4
                                                                  with:
                                                                            node-version: ${{ env.NODE_VERSION }}
                                                                                      cache: 'npm'

                                                                                            - run: npm ci --ignore-scripts --no-audit --no-fund

                                                                                                  - name: Lockfile verification
                                                                                                          run: git diff --exit-code package-lock.json || echo '⚠️ Lockfile modified — ensure integrity'
                                                                                                          
                                                                                                                - name: npm audit (high/critical) — blocking
                                                                                                                        # Allowlists next's bundled sharp/postcss advisories (unfixable without
                                                                                                                                # upgrading next past 16.2.12, which breaks the Vercel prod build). Any
                                                                                                                                        # other high/critical FAILS. See scripts/check-deps.mjs.
                                                                                                                                                run: node scripts/deps-audit-check.mjs
                                                                                                                                                
                                                                                                                                                      - name: Run ESLint
                                                                                                                                                              run: npx eslint src e2e scripts prisma --max-warnings=0
                                                                                                                                                              
                                                                                                                                                                    # Generate the Prisma client BEFORE typecheck: the API routes import
                                                                                                                                                                          # Typescript types generated by `prisma generate` (e.g. model unions).
                                                                                                                                                                                # Running typecheck first on a fresh runner (no pre-generated client)
                                                                                                                                                                                      # fails with "Argument of type 'unknown' is not assignable to 'string'".
                                                                                                                                                                                            - name: Generate Prisma client
                                                                                                                                                                                                    run: npx prisma generate
                                                                                                                                                                                                    
                                                                                                                                                                                                          - name: Run TypeScript check
                                                                                                                                                                                                                  run: npm run typecheck
                                                                                                                                                                                                                  
                                                                                                                                                                                                                        - name: Run unit tests
                                                                                                                                                                                                                                run: npm run test:ci
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                  # ── Job 2: Build ──────────────────────────────────────────────────────────
                                                                                                                                                                                                                                    build:
                                                                                                                                                                                                                                        name: Build App
                                                                                                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                                                                                                timeout-minutes: 25
                                                                                                                                                                                                                                                    needs: quality
                                                                                                                                                                                                                                                        permissions:
                                                                                                                                                                                                                                                              contents: read
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                                        - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                              - uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                node-version: ${{ env.NODE_VERSION }}
                                                                                                                                                                                                                                                                                                          cache: 'npm'
                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                - name: Create .env.local (build-time public vars only)
                                                                                                                                                                                                                                                                                                                        # Build-time NEXT_PUBLIC_* are inlined into the client bundle, so the
                                                                                                                                                                                                                                                                                                                                # build needs them; server-only secrets are NOT written here — the e2e
                                                                                                                                                                                                                                                                                                                                        # job writes its own minimal runtime .env.local against the local DB.
                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                          cat > .env.local << 'EOF'
                                                                                                                                                                                                                                                                                                                                                                    NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                                                                                                                                                                                                                                                                                                                                                                              NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                        NEXT_PUBLIC_STRIPE_PK=${{ secrets.NEXT_PUBLIC_STRIPE_PK }}
                                                                                                                                                                                                                                                                                                                                                                                                  NEXT_PUBLIC_APP_URL=https://kynthai.app
                                                                                                                                                                                                                                                                                                                                                                                                            NEXT_PUBLIC_COMPLIANCE_MODE=true
                                                                                                                                                                                                                                                                                                                                                                                                                      NEXT_PUBLIC_JURISDICTION=US
                                                                                                                                                                                                                                                                                                                                                                                                                                EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Install dependencies
                                                                                                                                                                                                                                                                                                                                                                                                                                              run: npm ci --ignore-scripts --no-audit --no-fund
                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Generate Prisma client
                                                                                                                                                                                                                                                                                                                                                                                                                                                            run: npx prisma generate
                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Build app
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: npm run build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            DATABASE_URL: ${{ secrets.DATABASE_URL }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      NODE_ENV: production
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # ── Job 3: E2E Tests against the freshly built local server ───────────────
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # NOTE: Production is hosted on Vercel (kynthai.app) and deploys via Vercel's
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # Git integration, not this workflow. This job is the real deploy gate: it
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # builds the app, seeds a throwaway postgres, starts the server on :3000 and
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # runs the smoke + auth suites against THAT build — a broken commit fails
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # here before Vercel ships it.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    e2e:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        name: E2E Tests
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                timeout-minutes: 30
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    needs: build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        permissions:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              contents: read
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                node-version: ${{ env.NODE_VERSION }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cache: 'npm'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Start services
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # CI uses a standalone disposable Postgres fixture on a dedicated
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # Docker bridge network. Host-run Prisma, Next, and Playwright use
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # the container IPv4 address; no fixed or ephemeral host port is used.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                docker compose -f docker-compose.ci.yml down -v --remove-orphans
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          docker compose -f docker-compose.ci.yml up -d db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    DB_CONTAINER_ID="$(docker compose -f docker-compose.ci.yml ps -q db)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ -z "$DB_CONTAINER_ID" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "Could not find the CI Postgres container" >&2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      docker compose -f docker-compose.ci.yml ps || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      DB_HOST_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_CONTAINER_ID")"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if ! [[ "$DB_HOST_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "Could not discover a valid CI Postgres container IP" >&2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        docker inspect "$DB_CONTAINER_ID" || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "E2E_DB_HOST_IP=${DB_HOST_IP}" >> "$GITHUB_ENV"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "DATABASE_URL=postgresql://postgres:postgres@${DB_HOST_IP}:5432/test" >> "$GITHUB_ENV"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "DIRECT_URL=postgresql://postgres:postgres@${DB_HOST_IP}:5432/test" >> "$GITHUB_ENV"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "Discovered Postgres container IP: ${DB_HOST_IP}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # Check both the database inside the container and the address that
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # host-run Prisma will use. This avoids the unreliable loopback port
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # path that failed on the previous main run.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              for i in $(seq 1 90); do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if docker compose -f docker-compose.ci.yml exec -T db pg_isready -U postgres -d test >/dev/null 2>&1 && (timeout 2 bash -c "echo > /dev/tcp/${DB_HOST_IP}/5432") 2>/dev/null; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "DB ready after ${i}s (container + bridge network)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      exit 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sleep 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "DB did not become ready within 90s at ${DB_HOST_IP}:5432" >&2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            docker compose -f docker-compose.ci.yml ps
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      docker logs "$DB_CONTAINER_ID" 2>&1 | tail -30 || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  POSTGRES_USER: postgres
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            POSTGRES_PASSWORD: postgres
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      POSTGRES_DB: test
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - run: npm ci --ignore-scripts --no-audit --no-fund
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - run: npx prisma generate
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Run DB push
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # Retry: postgres can still be crash-recovering or restarting right
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # after the readiness loop (P1001 seen ~40s after a green check).
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          for attempt in 1 2 3; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if npx prisma db push --accept-data-loss; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    exit 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "db push attempt $attempt failed, retrying in 5s..." >&2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sleep 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Seed demo data
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # Demo accounts (Demo@2024) must exist for the auth specs to log in.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: node prisma/seed.js
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: npm run build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Install Playwright
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: npx playwright install --with-deps
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Create ephemeral session signing key
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # The E2E job intentionally uses a disposable local-auth database, so it
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # must not depend on production Supabase secrets just to sign the local
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # kynthai-session cookie. GITHUB_ENV makes the random key available to
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # `next start` without storing or exposing a credential.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            run: echo "SESSION_SIGNING_SECRET=$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Create .env.local (runtime secrets)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # Writes the runtime secrets the server needs (env vars, NOT a build-time
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # concern): SESSION_SIGNING_SECRET is generated above for the disposable
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # local-auth session cookie; SUPABASE_SERVICE_ROLE_KEY remains available
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # for server-side Supabase APIs, and NEXT_PUBLIC_* let the app
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # client talk to Supabase. DATABASE_URL is intentionally omitted — the
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # job/env pins both prisma and the app at the Postgres container on
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # the CI bridge network. npm start reads this file itself.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cat > .env.local << 'EOF'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Start server
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # `npm start` (next start) loads .env.local (created above) automatically,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # so the session-signing key + Supabase runtime config are present.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # NOTE: Next prints "next start" does not work with "output: standalone"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # — that's advisory for Docker image builds; on a Node runner it serves
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # both /_next/static chunks (correct MIME) and SSR fine. Verified at
