name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  NEXT_PUBLIC_APP_URL: 'https://kynthai.app'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Type Check + Unit Tests ─────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (regenerate lockfile if needed)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lockfile verification
        run: git diff --exit-code pnpm-lock.yaml || echo '⚠️ Lockfile modified — ensure integrity'

      - name: npm audit (high/critical) — blocking
        # Allowlists next's bundled sharp/postcss advisories (unfixable without
        # upgrading next past 16.2.12, which breaks the Vercel prod build). Any
        # other high/critical FAILS. See scripts/check-deps.mjs.
        run: node scripts/deps-audit-check.mjs

      - name: Run ESLint
        run: pnpm exec eslint src e2e scripts prisma --max-warnings=0

      # Generate the Prisma client BEFORE typecheck: the API routes import
      # Typescript types generated by `prisma generate` (e.g. model unions).
      # Running typecheck first on a fresh runner (no pre-generated client)
      # fails with "Argument of type 'unknown' is not assignable to 'string'".
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run TypeScript check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:ci

  # ── Job 2: Build ──────────────────────────────────────────────────────────
  build:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Create .env.local (build-time public vars only)
        # Build-time NEXT_PUBLIC_* are inlined into the client bundle, so the
        # build needs them; server-only secrets are NOT written here — the e2e
        # job writes its own minimal runtime .env.local against the local DB.
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PK=${{ secrets.NEXT_PUBLIC_STRIPE_PK }}
          NEXT_PUBLIC_APP_URL=https://kynthai.app
          NEXT_PUBLIC_COMPLIANCE_MODE=true
          NEXT_PUBLIC_JURISDICTION=US
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build app
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

  # ── Job 3: E2E Tests against the freshly built local server ───────────────
  # NOTE: Production is hosted on Vercel (kynthai.app) and deploys via Vercel's
  # Git integration, not this workflow. This isolated regression check
  # builds the app, seeds a throwaway postgres, starts the server on :3000 and
  # runs the smoke + auth suites against THAT build — a broken commit fails
  # here. Branch protection/promotion must gate independent Vercel deploys.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Start services
        run: |
          # CI uses a standalone disposable Postgres fixture on a dedicated
          # Docker bridge network. Host-run Prisma, Next, and Playwright use
          # the container IPv4 address; no fixed or ephemeral host port is used.
          docker compose -f docker-compose.ci.yml down -v --remove-orphans
          docker compose -f docker-compose.ci.yml up -d db
          DB_CONTAINER_ID="$(docker compose -f docker-compose.ci.yml ps -q db)"
          if [ -z "$DB_CONTAINER_ID" ]; then
            echo "Could not find the CI Postgres container" >&2
            docker compose -f docker-compose.ci.yml ps || true
            exit 1
          fi
          DB_HOST_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_CONTAINER_ID")"
          if ! [[ "$DB_HOST_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not discover a valid CI Postgres container IP" >&2
            docker inspect "$DB_CONTAINER_ID" || true
            exit 1
          fi
          echo "E2E_DB_HOST_IP=${DB_HOST_IP}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@${DB_HOST_IP}:5432/test" >> "$GITHUB_ENV"
          echo "DIRECT_URL=postgresql://postgres:postgres@${DB_HOST_IP}:5432/test" >> "$GITHUB_ENV"
          echo "Discovered Postgres container IP: ${DB_HOST_IP}"
          # Check both the database inside the container and the address that
          # host-run Prisma will use. This avoids the unreliable loopback port
          # path that failed on the previous main run.
          for i in $(seq 1 90); do
            if docker compose -f docker-compose.ci.yml exec -T db pg_isready -U postgres -d test >/dev/null 2>&1 && (timeout 2 bash -c "echo > /dev/tcp/${DB_HOST_IP}/5432") 2>/dev/null; then
              echo "DB ready after ${i}s (container + bridge network)"
              exit 0
            fi
            sleep 1
          done
          echo "DB did not become ready within 90s at ${DB_HOST_IP}:5432" >&2
          docker compose -f docker-compose.ci.yml ps
          docker logs "$DB_CONTAINER_ID" 2>&1 | tail -30 || true
          exit 1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec prisma generate

      - name: Apply database migrations
        # DISPOSITION/CI DB → `prisma db push`.
        #
        # The E2E job seeds a throwaway Postgres (zero rows, discarded after
        # the run). `db push` materializes the FULL schema straight from the
        # Prisma client, which is exactly what a blank database needs.
        #
        # `prisma migrate deploy` is deliberately NOT used here: the committed
        # prisma/migrations/ history is INCREMENTAL ONLY — it holds no baseline
        # CREATE TABLE for the core schema (that schema was first created
        # out-of-band on the live Supabase DB). So on a blank database
        # `migrate deploy` aborts at the first `ALTER TABLE "users"` with
        # "relation users does not exist". `db push` sidesteps that.
        #
        # For a PERSISTENT production database the correct primitive is
        # `prisma migrate deploy` (non-destructive, applies recorded migrations
        # to _prisma_migrations); that database is managed by Vercel/Supabase,
        # not by this throwaway-DB CI job.
        # Retry: postgres can still be crash-recovering or restarting right
        # after the readiness loop (P1001 seen ~40s after a green check).
        run: |
          for attempt in 1 2 3; do
            if pnpm exec prisma db push --accept-data-loss; then
              exit 0
            fi
            echo "db push attempt $attempt failed, retrying in 5s..." >&2
            sleep 5
          done
          exit 1

      - name: Configure isolated fixture secrets
        run: |
          node <<'NODE'
          const { randomBytes } = require('crypto');
          const { appendFileSync } = require('fs');
          for (const name of ['E2E_FIXTURE_PASSWORD', 'ENCRYPTION_KEY', 'SESSION_SIGNING_SECRET']) {
            const value = randomBytes(32).toString('hex');
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          appendFileSync(process.env.GITHUB_ENV, 'DATABASE_BACKEND=ci-prisma\nENCRYPTION_TRANSITIONAL=false\n');
          NODE

      - name: Seed encrypted fixture data
        run: node prisma/seed.js

      - name: Build isolated app
        run: pnpm run build

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Start server
        # No deployed Supabase credentials are provided to this process.
        run: pnpm start &

      - name: Wait for server
        run: pnpm dlx wait-on http-get://localhost:3000/api/health --timeout 60000

      - name: Run E2E tests against the local build
        # Real gate: targets the freshly built local server on :3000 (the
        # smoke spec reads PLAYWRIGHT_BASE_URL). Previously ci-smoke.spec.ts
        # defaulted to the stale kynthai-deploy.vercel.app project, so the
        # API/browser half of the gate tested an old deployment and a broken
        # build could go green. auth.spec.ts now asserts real behavior
        # (validation toast, failed-login toast, patient redirect, admin
        # auth-guard redirect) instead of expect(true).toBe(true).
        run: pnpm exec playwright test e2e/ci-smoke.spec.ts e2e/auth.spec.ts e2e/ui-ux-sweep.spec.ts e2e/scenarios-matrix.spec.ts --project=chromium-desktop --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: e2e-report/
          retention-days: 30

      - name: Stop CI services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans


  # ── Job 4: Vercel Git integration handoff ────────────────────────────────
  # Production is deployed by Vercel's Git integration from the same push to
  # main. This job records the handoff after the build without requiring a
  # long-lived Vercel token in GitHub.
  deploy:
    name: Vercel Git integration handoff
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record production deployment handoff
        run: |
          echo "Vercel Git integration deploys main automatically; no CLI credential is required."
          {
            echo "## Vercel production handoff"
            echo ""
            echo "Vercel Git integration owns the production deployment for this main commit."
            echo "The build passed before this handoff job completed."
          } >> "$GITHUB_STEP_SUMMARY"
