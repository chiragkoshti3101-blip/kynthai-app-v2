name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/native-alarms.ts'
      - 'src/lib/native-shell-bootstrap.ts'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kynthai-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Detect release keystore secret
        id: ks
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.ks.outputs.present == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/kynthai-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$HOME/kynthai-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.ks.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kynthai-android-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build release AAB
        if: steps.ks.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kynthai-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Job summary
        run: |
          echo "### Android artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true
          if [ "${{ steps.ks.outputs.present }}" = "true" ]; then
            echo "Signed release: built" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed release: skipped (no keystore secrets)" >> "$GITHUB_STEP_SUMMARY"
          fi
