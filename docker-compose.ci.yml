# CI-only disposable Postgres fixture.
# Keep this definition separate from production Compose so CI never inherits
# production ports, secrets, networks, or app services.
# Host-run Prisma, Next, and Playwright connect to the container's IPv4 address
# on this dedicated bridge network; no host port is published or assumed.
services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - ci-host

networks:
  ci-host:
    driver: bridge
