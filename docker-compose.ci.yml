# CI-only Compose override. Production keeps the backend network internal.
# The E2E runner executes Prisma and Next on the host, so its throwaway
# Postgres must be reachable from host-run E2E steps.
# Port 0 asks Docker to allocate a free host port; the workflow exports the
# actual mapping before Prisma, Next, and Playwright run.
services:
  db:
    ports:
      - "127.0.0.1::5432"
    networks:
      - backend
      - ci-host

networks:
  ci-host:
    driver: bridge
